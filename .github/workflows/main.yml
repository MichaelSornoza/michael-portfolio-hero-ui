name: CI
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      logLevel:
        description: "Log level"
        required: true
        default: "warning"
      tags:
        description: "Test scenarios tags"
  schedule:
    - cron: "0 8 * * SAT"
jobs:
  build:
    name: Build Project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Use Node.js 18
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Build project
        run: yarn build
  custom-checkout:
    name: Custom Checkout Action
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/checkout
        with:
          MY_NAME: "Michael"
